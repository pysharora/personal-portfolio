<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick your build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a confident fork in the road, one tap and you're in.
   IDEA: two poster halves; the one you lean toward grows to fill the screen.
   PICTURE: the two giant words, each with a preview of what's behind it.
   COLOUR and TYPE: Engineer ink + orange, PM paper + cobalt. Anton + Inter Tight.
   LAYOUT: split screen on desktop, stacked halves on phones; name and seam badge tie them together. */
:root{color-scheme:light dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;font:16px/1.5 'Inter Tight',system-ui,sans-serif;background:#0E0E0E;overflow:hidden}
.gate{position:fixed;inset:0;display:flex}
.half{all:unset;box-sizing:border-box;position:relative;flex:1 1 0;display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,5vw,80px);cursor:pointer;overflow:hidden;transition:flex-grow .7s cubic-bezier(.7,0,.2,1)}
.eng{background:#0E0E0E;color:#F3EFE6;--acc:#FF4A1C}
.pm{background:#F3EFE6;color:#14161C;--acc:#2A3BFF}
.half:focus-visible{outline:4px solid var(--acc);outline-offset:-10px}
@media(hover:hover) and (min-width:801px){.gate:has(.eng:hover) .eng,.gate:has(.pm:hover) .pm{flex-grow:1.45}}
.kicker{font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:0 0 10px}
.word{font:400 clamp(72px,11vw,200px)/.84 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--acc);margin:0;white-space:nowrap;transition:transform .7s cubic-bezier(.7,0,.2,1);transform-origin:left bottom}
.line{font:400 clamp(24px,2.6vw,40px)/1.05 Anton,sans-serif;text-transform:uppercase;margin:22px 0 0;max-width:15ch}
.line mark{background:var(--acc);color:inherit;padding:0 .12em;display:inline-block;transform:rotate(-2deg)}
.eng .line mark{color:#0E0E0E}.pm .line mark{color:#F3EFE6}
.peek{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:8px;max-width:420px;font-weight:500;font-size:clamp(15px,1.25vw,17px);opacity:.82}
.peek li::before{content:"→ ";color:var(--acc);font-weight:800}
.cta{margin-top:32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.enter{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border:2px solid currentColor;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;transition:background .25s,color .25s}
.half:hover .enter,.half:focus-visible .enter{background:var(--acc);border-color:var(--acc);color:#fff}
.key{font-size:14px;opacity:.6}
.key kbd{font:700 13px 'Inter Tight',sans-serif;border:1.5px solid currentColor;border-radius:6px;padding:2px 8px;margin-inline:2px}

.top{position:fixed;left:0;right:0;top:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}
.top p{margin:0;padding:22px clamp(28px,5vw,80px);font:400 22px/1 Anton,sans-serif;text-transform:uppercase}
.top p:first-child{color:#F3EFE6}.top p:last-child{color:#14161C;text-align:right;font:600 15px/22px 'Inter Tight',sans-serif;text-transform:none}
.seam{position:fixed;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:#FF4A1C;background:linear-gradient(90deg,#FF4A1C 50%,#2A3BFF 50%);color:#fff;display:grid;place-items:center;font:400 22px/1 Anton,sans-serif;text-transform:uppercase;pointer-events:none;transition:opacity .3s;box-shadow:0 0 0 6px #0E0E0E,0 0 0 8px #F3EFE6}
.gate:has(.half:hover) ~ .seam{opacity:0}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;font-size:14px;font-weight:600;pointer-events:none}
.foot span{padding:18px clamp(28px,5vw,80px)}
.foot span:first-child{color:rgba(243,239,230,.7)}.foot span:last-child{color:rgba(20,22,28,.7);text-align:right}
.foot button{all:unset;pointer-events:auto;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.foot button:focus-visible{outline:2px solid #2A3BFF}

/* chosen: the picked half takes over */
.gate.go .half{flex-grow:0;padding-inline:0}
.gate.go .half.picked{flex-grow:1;padding-inline:clamp(28px,5vw,80px)}
.gate.go .half:not(.picked) > *{opacity:0}
.gate.go .picked .word{transform:scale(1.08)}
.gate.go ~ .seam,.gate.go ~ .top,.gate.go ~ .foot{opacity:0;transition:opacity .3s}
.done{position:fixed;inset:0;z-index:9;display:none;place-items:center;font:400 clamp(28px,4vw,48px)/1.1 Anton,sans-serif;text-transform:uppercase;text-align:center;padding:24px}
.done small{display:block;font:600 15px 'Inter Tight',sans-serif;text-transform:none;margin-top:14px;opacity:.7}
.done button{all:unset;cursor:pointer;margin-top:22px;display:inline-flex;min-height:44px;align-items:center;padding:0 20px;border:2px solid currentColor;font:800 14px 'Inter Tight',sans-serif;letter-spacing:.06em}

@media(max-width:800px){
  .gate{flex-direction:column}
  .half{justify-content:flex-end;padding:72px 22px 26px}
  .pm{justify-content:flex-start;padding:26px 22px 60px}
  .word{font-size:clamp(64px,20vw,120px)}
  .line{margin-top:12px;font-size:24px}
  .peek{display:none}
  .cta{margin-top:16px}.key{display:none}
  .enter{min-height:48px;padding:0 20px}
  .top{grid-template-columns:1fr}.top p:last-child{display:none}
  .seam{width:68px;height:68px;font-size:17px;background:linear-gradient(180deg,#FF4A1C 50%,#2A3BFF 50%)}
  .foot{grid-template-columns:1fr}.foot span:first-child{display:none}.foot span:last-child{text-align:center}
}
@media(max-height:560px) and (min-width:801px){.peek{display:none}}
/* boot loader (first visit) */
.boot{position:fixed;inset:0;z-index:20;display:flex;pointer-events:none}
.boot i{flex:1;background:#0E0E0E;transition:transform .8s cubic-bezier(.7,0,.2,1)}
.boot.open i:first-child{transform:translateX(-100%)}.boot.open i:last-child{transform:translateX(100%)}
.bootIn{position:fixed;inset:0;z-index:21;display:grid;place-items:center;color:#F3EFE6;pointer-events:none;transition:opacity .3s}
.boot.open + .bootIn{opacity:0}
.bootIn div{width:min(560px,84vw)}
.bootIn p{margin:0;display:flex;justify-content:space-between;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.count{font:400 clamp(110px,22vw,240px)/.85 Anton,sans-serif;margin:10px 0 18px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(243,239,230,.15);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF4A1C 50%,#2A3BFF 50%);background-size:min(560px,84vw) 100%}

/* mode loader (after choosing) */
.done{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,96px);--acc:#FF4A1C}
.done .k{margin:0 0 14px;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.done h2{margin:0;font:400 clamp(56px,10vw,170px)/.86 Anton,sans-serif;text-transform:uppercase}
.done h2 span{display:inline-block}
.done h2 mark{background:var(--acc);color:inherit;padding:0 .1em;display:inline-block;transform:rotate(-2deg)}
.done .prog{position:fixed;left:0;bottom:0;height:8px;width:0;background:var(--acc)}
.done .after{margin-top:28px;opacity:0;transition:opacity .4s;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-weight:600}
.done .after.show{opacity:1}
.done .after button{all:unset;cursor:pointer;display:inline-flex;min-height:44px;align-items:center;padding:0 20px;border:2px solid currentColor;font:800 14px 'Inter Tight',sans-serif;letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="gate" id="gate" aria-label="Choose how to view this portfolio">
<button class="half eng" data-mode="engineer" aria-label="Enter as Engineer: code, systems, what I shipped">
<p class="kicker">Show me the</p>
<p class="word">Engineer</p>
<p class="line">I build the thing <mark>right.</mark></p>
<ul class="peek"><li>React, Next.js, Node, Postgres</li><li>What I built for 40+ enterprise clients</li><li>Engineer CV</li></ul>
<div class="cta"><span class="enter">Enter →</span><span class="key">or press <kbd>E</kbd></span></div>
</button>
<button class="half pm" data-mode="pm" aria-label="Enter as PM: roadmaps, delivery, what I led">
<p class="kicker">Show me the</p>
<p class="word">PM</p>
<p class="line">I build the <mark>right</mark> thing.</p>
<ul class="peek"><li>Roadmaps, sprints and stakeholders</li><li>MBA in IT Project Management, distinction</li><li>PM CV</li></ul>
<div class="cta"><span class="enter">Enter →</span><span class="key">or press <kbd>P</kbd></span></div>
</button>
</main>
<div class="top" aria-hidden="true"><p>Piyush Arora</p><p>Full-stack engineer with an MBA</p></div>
<div class="seam" aria-hidden="true">or</div>
<div class="foot"><span>Two ways to see the same work. Switch anytime.</span><span>Not sure? <button id="skip">Just show me everything</button></span></div>
<div class="done" id="done" role="status" aria-live="polite">
<p class="k" id="doneK"></p>
<h2 id="doneH"></h2>
<div class="after" id="after"><span>This is where your site would load.</span><button id="again">Back to the gate</button></div>
<i class="prog" id="prog"></i>
</div>
<div class="boot" id="boot" aria-hidden="true"><i></i><i></i></div>
<div class="bootIn" id="bootIn" aria-hidden="true"><div><p><span>Piyush Arora</span><span>Portfolio</span></p><div class="count" id="count">00</div><div class="bar"><b id="barFill"></b></div></div></div>

<script>
{
const gate=document.getElementById('gate'),done=document.getElementById('done');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* boot loader: counts to 100, then the curtain splits open */
const boot=document.getElementById('boot'),bootIn=document.getElementById('bootIn'),count=document.getElementById('count'),barFill=document.getElementById('barFill');
const openBoot=()=>{boot.classList.add('open');setTimeout(()=>{boot.style.display='none';bootIn.style.display='none'},900)};
if(reduce){openBoot()}else{
  const t0=performance.now(),dur=1100;
  const tick=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);count.textContent=String(Math.round(e*100)).padStart(2,'0');barFill.style.width=(e*100)+'%';if(p<1)requestAnimationFrame(tick);else setTimeout(openBoot,180)};
  requestAnimationFrame(tick);
}

/* mode loader: headline builds word by word, progress line fills */
const doneK=document.getElementById('doneK'),doneH=document.getElementById('doneH'),after=document.getElementById('after'),prog=document.getElementById('prog');
const showLoader=pm=>{
  done.style.background=pm?'#F3EFE6':'#0E0E0E';done.style.color=pm?'#14161C':'#F3EFE6';done.style.setProperty('--acc',pm?'#2A3BFF':'#FF4A1C');
  doneK.textContent=pm?'Loading the PM view':'Loading the Engineer view';
  const words=pm?['I','build','the','<mark>right</mark>','thing.']:['I','build','the','thing','<mark>right.</mark>'];
  doneH.innerHTML=words.map(w=>'<span>'+w+'</span>').join(' ');
  after.classList.remove('show');prog.style.width='0';done.style.display='flex';
  if(reduce){prog.style.width='100%';after.classList.add('show');return}
  doneH.querySelectorAll('span').forEach((s,i)=>s.animate([{transform:'translateY(40%)',opacity:0},{transform:'none',opacity:1}],{duration:450,delay:i*110,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'}));
  const run=prog.animate([{width:'0%'},{width:'100%'}],{duration:1100,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  run.onfinish=()=>after.classList.add('show');
};

const choose=mode=>{
  if(gate.classList.contains('go'))return;
  try{localStorage.setItem('mode',mode)}catch(e){}
  const half=gate.querySelector('[data-mode="'+mode+'"]');
  half.classList.add('picked');gate.classList.add('go');
  setTimeout(()=>showLoader(mode==='pm'),reduce?0:750);
};
gate.querySelectorAll('.half').forEach(h=>h.addEventListener('click',()=>choose(h.dataset.mode)));
document.getElementById('skip').addEventListener('click',()=>choose('engineer'));
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  const k=e.key.toLowerCase();
  if(k==='e')choose('engineer');if(k==='p')choose('pm');
});
document.getElementById('again').addEventListener('click',()=>{
  done.style.display='none';gate.classList.remove('go');gate.querySelectorAll('.picked').forEach(h=>h.classList.remove('picked'));
});
}
</script>
</body>
</html>
